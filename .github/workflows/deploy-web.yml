name: Deploy web to GitHub Pages

# This must be the ONLY workflow that deploys Pages, and Settings -> Pages ->
# Source must be "GitHub Actions".
#
# Adding a second Pages workflow does not merge with this one — they race, and
# the last to finish wins. GitHub's "Deploy Jekyll" starter (offered when you
# switch the Pages source) builds the repository root, which here is just the
# README, and silently replaced the built app with it.
#
# Note the paths filter below: a commit that touches neither etzan/web/** nor
# this file will not deploy. Use "Run workflow" on the Actions tab for those.

on:
  push:
    branches: [main]
    paths: ["etzan/web/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etzan/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: etzan/web/package-lock.json
      - run: npm ci

      # BrowserRouter needs the app served from a known base path. On a project
      # site that is /<repo>/; deriving it here means nothing is hardcoded and a
      # repository rename cannot silently break every deep link.
      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      # GitHub Pages has no server-side rewrites, so a deep link like /brain
      # would 404. Pages serves 404.html for unknown paths — making it a copy of
      # index.html hands the URL to the client router instead.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      # robots.txt and sitemap.xml need the real origin, which only the workflow
      # knows. Generating them here avoids committing a guessed domain.
      - name: Generate robots.txt and sitemap.xml
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          printf 'Sitemap: %s/sitemap.xml\n' "$SITE_URL" >> dist/robots.txt
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">'
            for path in "" "brain" "sleep" "dashboard" "about"; do
              echo "  <url><loc>${SITE_URL}/${path}</loc></url>"
            done
            echo '</urlset>'
          } > dist/sitemap.xml

      - uses: actions/upload-pages-artifact@v3
        with:
          path: etzan/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
