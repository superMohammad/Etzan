<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#faf3e7" />

    <!-- Defaults only. usePageMeta rewrites the title, description, canonical
         and Open Graph tags per route and per language once React mounts. -->
    <title>اتزان — توازنك الرقمي</title>
    <meta
      name="description"
      content="افحص أثر الشاشة على تركيزك وجودة نومك بنماذج تعلّم آلي تعمل داخل متصفحك، دون إرسال أي بيانات."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "اتزان",
        "alternateName": "Etzan",
        "applicationCategory": "HealthApplication",
        "operatingSystem": "Any browser",
        "inLanguage": ["ar", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "SAR" },
        "description": "أدوات تقيس أثر الشاشة على التركيز وجودة النوم، بنماذج تعلّم آلي تعمل بالكامل داخل المتصفح دون إرسال بيانات.",
        "featureList": [
          "فحص التعفن الدماغي",
          "فحص جودة النوم وموعد النوم المثالي",
          "لوحة متابعة الاتزان الرقمي"
        ],
        "creator": {
          "@type": "Organization",
          "name": "Tuwaiq Academy"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
